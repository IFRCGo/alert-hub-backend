kind: SecretProviderClass
metadata:
  name: alert-hub-staging-secret-provider
spec:
  provider: azure
  parameters:
    clientID: ""
    keyvaultName: ""
    tenantId: ""
    usePodIdentity: "false"
    objects: |
      array:
        - |
          objectName: DB-HOST
          objectType: secret
        - |
          objectName: DB-NAME
          objectType: secret
        - |
          objectName: DB-PASSWORD
          objectType: secret
        - |
          objectName: DB-PORT
          objectType: secret
        - |
          objectName: DB-USER
          objectType: secret
        - |
          objectName: DJANGO-SECRET-KEY
          objectType: secret
        - |
          objectName: EMAIL-HOST
          objectType: secret
        - |
          objectName: EMAIL-HOST-PASSWORD
          objectType: secret
        - |
          objectName: EMAIL-HOST-USER
          objectType: secret
        - |
          objectName: EMAIL-PORT
          objectType: secret
        - |
          objectName: HCAPTCHA-SECRET
          objectType: secret
        - |
          objectName: HCAPTCHA-SITEKEY
          objectType: secret
        - |
          objectName: SENTRY-DSN
          objectType: secret
  secretObjects:
    - secretName: alert-hub-staging-secret
      type: Opaque
      data:
        - objectName: DB-HOST
          key: DB_HOST
        - objectName: DB-NAME
          key: DB_NAME
        - objectName: DB-PASSWORD
          key: DB_PASSWORD
        - objectName: DB-PORT
          key: DB_PORT
        - objectName: DB-USER
          key: DB_USER
        - objectName: DJANGO-SECRET-KEY
          key: DJANGO_SECRET_KEY
        - objectName: EMAIL-HOST
          key: EMAIL_HOST
        - objectName: EMAIL-HOST-PASSWORD
          key: EMAIL_HOST_PASSWORD
        - objectName: EMAIL-HOST-USER
          key: EMAIL_HOST_USER
        - objectName: EMAIL-PORT
          key: EMAIL_PORT
        - objectName: HCAPTCHA-SECRET
          key: HCAPTCHA_SECRET
        - objectName: HCAPTCHA-SITEKEY
          key: HCAPTCHA_SITEKEY
        - objectName: SENTRY-DSN
          key: SENTRY_DSN

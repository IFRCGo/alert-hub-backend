environment: staging
fullnameOverride: ifrcgo-alert-hub

ingress:
  enabled: true
  className: nginx
  tls:
    enabled: true
    secretName:
  # Needs to be defined at go-deploy
  # host: alerthub-stage-api.ifrc.org

redis:
  master:
    resourcesPreset: micro  # https://github.com/bitnami/charts/blob/main/bitnami/common/templates/_resources.tpl#L16

# FIXME: Use proper requests.cpu
worker:
  beat:
    resources:
      requests:
        cpu: "0.1"
        memory: 0.5Gi
      limits:
        cpu: "1"
        memory: 1Gi
  flower:
    resources:
      requests:
        cpu: "0.1"
        memory: 0.5Gi
      limits:
        cpu: "1"
        memory: 1Gi
  queues:
    # NOTE: Make sure keys are lowercase
    default:
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
    feeds:
      replicaCount: 2
      resources:
        requests:
          cpu: "0.2"
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi

# FIXME: Use proper requests.cpu
api:
  resources:
    requests:
      cpu: "0.2"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 2Gi

env:
  DJANGO_DEBUG: false
  # Misc
  DEFAULT_FROM_EMAIL: Alerthub Staging <hazard.alerts@ifrc.org>
  # Sentry
  SENTRY_TRACES_SAMPLE_RATE: 0.5
  SENTRY_PROFILE_SAMPLE_RATE: 0.5
  # Needs to be defined at go-deploy
  # # App Domain
  # APP_FRONTEND_HOST: https://alerthub-stage.ifrc.org
  # APP_DOMAIN: alerthub-stage-api.ifrc.org
  # DJANGO_ALLOWED_HOSTS: alerthub-stage-api.ifrc.org
  # SESSION_COOKIE_DOMAIN: .ifrc.org
  # CSRF_COOKIE_DOMAIN: .ifrc.org
  # # CORS
  # CORS_ALLOWED_ORIGINS: https://alerthub-stage.ifrc.org

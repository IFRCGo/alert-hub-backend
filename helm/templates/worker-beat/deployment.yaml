{{- if .Values.worker.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "ifrcgo-alert-hub.fullname" . }}-worker-beat
  labels:
    app: {{ include "ifrcgo-alert-hub.fullname" . }}
    component: worker-beat
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1  # This should only 1
  selector:
    matchLabels:
      app: {{ include "ifrcgo-alert-hub.fullname" . }}
      component: worker-beat
  template:
    metadata:
      labels:
        app: {{ include "ifrcgo-alert-hub.fullname" . }}
        component: worker-beat
    spec:
      containers:
        - name: worker-beat
          image: "{{ .Values.image.name }}:{{ .Values.image.tag }}"
          command: ["/code/deploy/run_worker_beat.sh"]
          # TODO: livenessProbe
          resources:
            {{- toYaml .Values.worker.beat.resources | nindent 12 }}
          env:
            - name: DJANGO_APP_TYPE
              value: worker
          envFrom:
            - secretRef:
                name: {{ template "ifrcgo-alert-hub.secretname" . }}
            - configMapRef:
                name: {{ template "ifrcgo-alert-hub.fullname" . }}-api-configmap

      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- end }}

{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "ifrcgo-alert-hub.fullname" . }}-ingress
  labels:
    app: {{ template "ifrcgo-alert-hub.name" . }}
    component: api-ingress
    environment: {{ .Values.environment }}
    release: {{ .Release.Name }}
spec:
  {{- if .Values.ingress.ingressClassName }}
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ template "ifrcgo-alert-hub.fullname" . }}-api-svc
                port:
                  number: 80

{{- end }}

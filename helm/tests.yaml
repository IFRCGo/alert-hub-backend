# Snapshot test matrix consumed by ./update-snapshots.sh (fugit).
# Each key is a snapshot under ./snapshots/, rendered from values.yaml (base)
# + the listed values files + the matching ./tests/<key> override.
tests:
  alpha.yaml:
    - tests/operators.yaml
    - values-alpha.yaml
  staging.yaml:
    - tests/operators.yaml
    - values-go-deploy.yaml
    - values-staging.yaml
  production.yaml:
    - tests/operators.yaml
    - values-go-deploy.yaml
    - values-production.yaml

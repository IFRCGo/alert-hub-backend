app:
  environment: PROD
  nameOverride: alerthub

  appTypeEnvName: "DJANGO_APP_TYPE"

  # Global Image
  image:
    name: SET-BY-CICD-IMAGE
    tag: SET-BY-CICD-TAG
    imagePullPolicy: IfNotPresent

  # NOTE: DB/cache/broker are supplied externally (extraManifests + user secrets);
  # the old bundled postgresql/redis/minio subcharts are gone in banjo-helm 0.4.

  api:
    enabled: true
    containerPort: 80
    command: ["/code/deploy/run_web.sh"]
    ingress:
      enabled: true
      className:
      host:
    probes:
      # banjo-utils HealthProbeMiddleware serves /healthz/live/ and /healthz/ready/.
      # Chart defaults (liveness /healthz/live/, readiness+startup /healthz/ready/) apply.
      enabled: true
    resources:
      requests:
        cpu: "0.2"
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 1Gi

  worker:
    enabled: true
    queueDefaults:
      commandPrefix:
        - "celery"
        - "-A"
        - "main"
        - "worker"
        - "-l"
        - "INFO"
      # banjo-celery-probe heartbeat wiring (writer via setup_worker_heartbeat,
      # reader via banjo-celery-probe) on a RAM emptyDir.
      extraEnv:
        BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/worker_heartbeat
      volumes:
        celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
      volumeMounts:
        celery-heartbeat: {mountPath: /var/run/celery}
      probes:
        enabled: true
        liveness:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 6
        startup:
          exec: {command: [banjo-celery-probe]}
          periodSeconds: 5
          failureThreshold: 30
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 1536Mi
    queues:
      # NOTE: Make sure keys are lowercase
      default:
        enabled: true
        celeryArgs:
          - "-Q"
          - "default"
          - "--concurrency"
          - "4"
          - "--max-tasks-per-child"
          - "10"
      feeds:
        enabled: true
        celeryArgs:
          - "-Q"
          - "feeds"
          - "--concurrency"
          - "4"
          - "--max-tasks-per-child"
          - "10"
          - "--soft-time-limit"
          - "300"
          - "--time-limit"
          - "500"
        resources:
          limits:
            cpu: "2"
    addons:
      beat:
        enabled: true
        # HeartbeatPersistentScheduler keeps celery's built-in PersistentScheduler
        # (schedule stays code-defined in main.celery) while touching the beat
        # heartbeat file each tick for banjo-celery-probe liveness.
        command:
          - "celery"
          - "-A"
          - "main"
          - "beat"
          - "-l"
          - "INFO"
          - "--scheduler=banjo_utils.celery_health.persistent.HeartbeatPersistentScheduler"
        strategy: {type: Recreate}
        extraEnv:
          BANJO_CELERY_HEARTBEAT_FILE: /var/run/celery/beat_heartbeat
        volumes:
          celery-heartbeat: {emptyDir: {medium: Memory, sizeLimit: 1Mi}}
        volumeMounts:
          celery-heartbeat: {mountPath: /var/run/celery}
        probes:
          enabled: true
          liveness:
            # --max-age must exceed PersistentScheduler's max_interval (300s)
            exec: {command: [banjo-celery-probe, --max-age, "360"]}
            periodSeconds: 60
            timeoutSeconds: 5
            failureThreshold: 3
        resources:
          requests:
            cpu: "0.1"
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi

  hooks:
    enabled: true
    defaults:
      resources:
        requests:
          cpu: "0.1"
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 2Gi
    jobs:
      # NOTE: Make sure keys are lowercase.
      # db-migrate and collect-static inherit the chart defaults verbatim
      # (Sync hook @ wave 20, `manage.py migrate` / `collectstatic --noinput`).
      # Only wait-for-resources overrides the default (bare) command.
      wait-for-resources:
        command: ["./manage.py", "wait_for_resources", "--db", "--cache", "--celery-broker"]

  cronjobs:
    enabled: false

  # NOTE: Check main/settings.py for all available options
  env:
    APP_RELEASE: "{{ $.Values.image.tag }}"
    APP_ENVIRONMENT: "{{ $.Values.environment }}"
    DJANGO_DEBUG: "false"
    DJANGO_TIME_ZONE: UTC
    # App Domain
    APP_DOMAIN: "{{ required \".app.env.APP_DOMAIN\" nil }}"
    APP_HTTP_PROTOCOL: https
    APP_FRONTEND_HOST: "{{ required \".app.env.APP_FRONTEND_HOST\" nil }}"
    DJANGO_ALLOWED_HOSTS: "*"
    SESSION_COOKIE_DOMAIN: "{{ required \".app.env.SESSION_COOKIE_DOMAIN\" nil }}"
    CSRF_COOKIE_DOMAIN: "{{ required \".app.env.CSRF_COOKIE_DOMAIN\" nil }}"
    # CORS
    CORS_ALLOWED_ORIGINS: "{{ required \".app.env.CORS_ALLOWED_ORIGINS\" nil }}"
    CORS_ALLOWED_ORIGIN_REGEXES: ""
    # Misc
    UPTIME_WORKER_HEARTBEAT: ""
    EMAIL_USE_TLS: "true"
    DEFAULT_FROM_EMAIL: "{{ required \".app.env.DEFAULT_FROM_EMAIL\" nil }}"
    # Sentry
    SENTRY_TRACES_SAMPLE_RATE: "0.2"
    SENTRY_PROFILE_SAMPLE_RATE: "0.2"
    # Azure configs TODO: Add support for AZURE_STORAGE_TOKEN_CREDENTIAL
    USE_AZURE_STORAGE: "false"  # NOTE: Make sure this is boolean and not string
    AZURE_STORAGE_MANAGED_IDENTITY: "true"
    AZURE_STORAGE_MEDIA_CONTAINER: "{{- if (eq (lower (toString .Values.env.USE_AZURE_STORAGE)) \"true\") }}{{ required \".app.env.AZURE_STORAGE_MEDIA_CONTAINER\" nil }}{{- end }}"
    AZURE_STORAGE_STATIC_CONTAINER: "{{- if (eq (lower (toString .Values.env.USE_AZURE_STORAGE)) \"true\") }}{{ required \".app.env.AZURE_STORAGE_STATIC_CONTAINER\" nil }}{{- end }}"
    AZURE_STORAGE_ACCOUNT_NAME: "{{- if (eq (lower (toString .Values.env.USE_AZURE_STORAGE)) \"true\") }}{{ required \".app.env.AZURE_STORAGE_ACCOUNT_NAME\" nil }}{{- end }}"

  # NOTE: Check main/settings.py for all available options
  secrets:
    DJANGO_SECRET_KEY: "{{ required \".app.secrets.DJANGO_SECRET_KEY\" nil }}"
    # Postgres
    DB_NAME: "{{ required \".app.secrets.DB_NAME\" nil }}"
    DB_USER: "{{ required \".app.secrets.DB_USER\" nil }}"
    DB_PASSWORD: "{{ required \".app.secrets.DB_PASSWORD\" nil }}"
    DB_HOST: "{{ required \".app.secrets.DB_HOST\" nil }}"
    DB_PORT: "{{ required \".app.secrets.DB_PORT\" nil }}"
    # Sentry
    SENTRY_DSN: "{{ required \".app.secrets.SENTRY_DSN\" nil }}"
    # Email
    EMAIL_HOST: "{{ required \".app.secrets.EMAIL_HOST\" nil }}"
    EMAIL_PORT: "{{ required \".app.secrets.EMAIL_PORT\" nil }}"
    EMAIL_HOST_USER: "{{ required \".app.secrets.EMAIL_HOST_USER\" nil }}"
    EMAIL_HOST_PASSWORD: "{{ required \".app.secrets.EMAIL_HOST_PASSWORD\" nil }}"
    # Hcaptcha
    HCAPTCHA_SITEKEY: "{{ required \".app.secrets.HCAPTCHA_SITEKEY\" nil }}"
    HCAPTCHA_SECRET: "{{ required \".app.secrets.HCAPTCHA_SECRET\" nil }}"
    # - Celery
    # CELERY_RABBITMQ_CONNECTION_STRING: Defined using extraEnvVars
    # CELERY_RABBITMQ_VHOST: Defined using extraEnvVars
    # CELERY_RESULT_BACKEND: Defined using extraEnvVars
    # - Cache
    # CACHE_REDIS_URL: Defined using extraEnvVars

  # NOTE: Operator-managed infra (Dragonfly cache, RabbitMQ broker) and the
  # matching extraEnvVars/extraManifests live in ./values/operators.yaml.

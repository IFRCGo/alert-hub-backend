[tool.poetry]
name = "alert-hub-backend"
version = "0.1.0"
description = ""
authors = ["IFRC"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
Django = ">=4.2,<4.3"
celery = "^5.3"
django-celery-beat = "*"
django-cors-headers = "*"
django-environ = "*"
django-redis = "^5.3.0"
django-storages = "*"
django-admin-autocomplete-filter = "*"
django-modeltranslation = "==0.19.5"
iso639-lang = "^2.1.0"
psycopg2-binary = "^2.9.9"
pytz = "*"
colorlog = "*"
requests = "*"
strawberry-graphql-django = {extras = ["strawberry-graphql"], version = "0.47.1"}
sentry-sdk = "*"
djangorestframework = "*"
validators = "*"
django-health-check = "*"
psutil = "*"
uwsgi = "*"
django-premailer = "*"
user-agents = "*"
factory-boy = "*"

[tool.poetry.dev-dependencies]
pytest = "*"
ipython = "*"
pytest-profiling = "*"
pytest-ordering = "*"
pytest-django = "*"
django-stubs = "==4.2.6"  # NOTE: 4.2.7 is messing with TextChoices/IntergerChoices
celery-types = "*"

[tool.ruff]
exclude = [
    "**/__pycache__",
    "**/snap_test_*.py",
    ".venv/",
    "legacy/",
    "**/migrations/*.py",
]

[tool.black]
line-length = 125
skip-string-normalization = true
# NOTE: Update in .pre-commit-config.yaml as well
extend-exclude = "(__pycache__|.*snap_test_.*\\.py|.+\\/.+\\/migrations\\/.*)"

[tool.isort]
profile = "black"
multi_line_output = 3
skip = [
    "**/__pycache__",
    "**/snap_test_*.py",
    ".venv/",
    "legacy/",
    "**/migrations/*.py",
]

[tool.pyright]
exclude = [
    "**/__pycache__",
    "**/snap_test_*.py",
    ".venv/",
    "legacy/",
    "**/migrations/*.py",
]
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "main.settings"
log_cli = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

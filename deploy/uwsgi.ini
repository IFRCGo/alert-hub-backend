[uwsgi]

chdir = /code/
module = main.wsgi

master = true
processes = 10
http = 0.0.0.0:80
chmod = 666

vacuum = true
harakiri = 60

# Skip access logging for liveness/readiness probes — they fire every few seconds and would otherwise drown out the logs.
#
# Caveat: uWSGI's `donotlog` is unconditional, so this also suppresses any error responses (5xx) on these routes.
# uWSGI can't make logging conditional on status code; switch to gunicorn if we need to keep logging probe errors.
#
# NOTE: trailing `/?` matches the banjo probe URLs (/healthz/live/, /healthz/ready/), which carry a trailing slash.
route = ^/healthz/(live|ready)/?$ donotlog:
